- title: AceBench
  subtitle: A Multi-Dimensional Benchmark for Agentic Edge-Cloud Collaboration
  description: 面向大模型智能体端云协作的多维基准，基于真实 OpenClaw 工作空间提供 128 个可执行任务，其中 100 个带有细粒度隐私标注，联合评估任务效用、资源成本与隐私暴露，并覆盖六种端侧、云侧和端云协作策略。
