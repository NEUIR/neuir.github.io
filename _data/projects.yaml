- title: MemoryCard
  subtitle: Video Memory Augmentation for Long-Video Question Answering
  description: 面向长视频问答的免训练视频记忆增强框架，将长视频组织为语义连贯的多模态 Memory Cards，融合事件级视觉上下文、代表性时刻、语音转写与时间线索，为视觉语言模型提供紧凑、高密度的多模态证据。
