name: deploy-gh-pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node for browser logic tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Check browser scripts and analytics invariants
        run: |
          for script in _scripts/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs

      - name: Build site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build
          bundle exec ruby scripts/check_site.rb
          node --check _site/assets/js/site.js
          node --check _site/assets/js/search.js
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean: true
