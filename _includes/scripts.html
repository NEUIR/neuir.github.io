{% assign asset_version = site.time | date: "%s" %}
<script>
  // Restore the theme before painting without a blocking network request.
  try {
    document.documentElement.dataset.dark = window.localStorage.getItem("dark-mode") === "true" ? "true" : "false";
  } catch {
    document.documentElement.dataset.dark = "false";
  }
</script>
<script src="{{ "/assets/vendor/popper.min.js" | relative_url }}?v={{ site.data.asset_hashes['assets/vendor/popper.min.js'] }}" defer></script>
<script src="{{ "/assets/vendor/tippy.min.js" | relative_url }}?v={{ site.data.asset_hashes['assets/vendor/tippy.min.js'] }}" defer></script>
{% if page.url == "/research/" %}
<script src="{{ "/assets/vendor/mark.min.js" | relative_url }}?v={{ site.data.asset_hashes['assets/vendor/mark.min.js'] }}" defer></script>
{% endif %}
<script src="{{ "/assets/js/site.js" | relative_url }}?v={{ asset_version }}" defer></script>
{% if page.url == "/research/" %}
<script src="{{ "/assets/js/search.js" | relative_url }}?v={{ asset_version }}" defer></script>
{% endif %}
{% if page.url == "/404.html" %}
<script src="{{ "/_scripts/site-search.js" | relative_url }}?v={{ asset_version }}" defer></script>
{% endif %}
