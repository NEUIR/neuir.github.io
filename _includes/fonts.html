<link rel="preload" href="{{ "/assets/fonts/barlow-latin-400-normal.woff2" | relative_url }}?v={{ site.data.asset_hashes['assets/fonts/barlow-latin-400-normal.woff2'] }}" as="font" type="font/woff2" crossorigin>
{% assign hero_image = page.header | default: site.header %}
{% if hero_image %}
<link rel="preload" href="{{ hero_image | background_image: 960 | relative_url }}" as="image" media="(max-width: 760px)" fetchpriority="high">
<link rel="preload" href="{{ hero_image | background_image: 1920 | relative_url }}" as="image" media="(min-width: 761px)" fetchpriority="high">
{% endif %}
